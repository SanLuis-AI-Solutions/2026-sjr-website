name: Weekly Health Report

on:
  schedule:
    # Mondays 14:00 UTC / 8:00 AM CST / 9:00 AM CDT
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Verify
        id: verify
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path .health | Out-Null
          pwsh -File scripts/verify.ps1 -Ci -ReportPath .health/report.md
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check Google Snapshot Credentials
        id: google_config
        shell: pwsh
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          $hasEmail = -not [string]::IsNullOrWhiteSpace($env:GOOGLE_SERVICE_ACCOUNT_EMAIL)
          $hasKey = -not [string]::IsNullOrWhiteSpace($env:GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY)
          if ($hasEmail -and $hasKey) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Run Weekly Analytics Snapshots
        id: seo_snapshots
        if: ${{ steps.google_config.outputs.available == 'true' }}
        shell: pwsh
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          SEARCH_CONSOLE_PROPERTY: ${{ vars.SEARCH_CONSOLE_PROPERTY }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: |
          $failed = 0
          npm run google:weekly-seo-health
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          npm run google:kpi-weekly-snapshot
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          npm run google:reconcile-90d
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          "exit_code=$failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Weekly Health Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-${{ github.run_id }}
          path: |
            .health/report.md
            .health/weekly-seo-health-latest.md
            .health/weekly-seo-health-latest.json
            .health/kpi-weekly-snapshot-latest.md
            .health/kpi-weekly-snapshot-latest.json
            .health/ga4-gsc-reconciliation-90d-latest.md
            .health/ga4-gsc-reconciliation-90d-latest.json
          if-no-files-found: warn

      - name: Upsert Weekly Health Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Weekly SEO Health Report';
            const reportPath = '.health/report.md';
            const exitCode = Number('${{ steps.verify.outputs.exit_code }}' || '0');
            const seoStepRan = '${{ steps.google_config.outputs.available }}' === 'true';
            const seoExitCode = Number('${{ steps.seo_snapshots.outputs.exit_code }}' || '0');
            const weeklySeoPath = '.health/weekly-seo-health-latest.md';
            const kpiPath = '.health/kpi-weekly-snapshot-latest.md';
            const reconcilePath = '.health/ga4-gsc-reconciliation-90d-latest.md';

            function readIfExists(filePath, fallback) {
              try {
                return fs.readFileSync(filePath, 'utf8');
              } catch (e) {
                return fallback;
              }
            }

            const verifyBody = readIfExists(
              reportPath,
              `Health report file missing: ${reportPath}\n\nVerify exit code: ${exitCode}`
            );
            const weeklySeoBody = seoStepRan
              ? readIfExists(
                  weeklySeoPath,
                  `Weekly SEO snapshot missing: ${weeklySeoPath}\n\nSEO snapshot exit code: ${seoExitCode}`
                )
              : 'Weekly SEO snapshots were skipped because Google service-account secrets are not configured in GitHub Actions.';
            const kpiBody = seoStepRan
              ? readIfExists(
                  kpiPath,
                  `Weekly KPI snapshot missing: ${kpiPath}\n\nSEO snapshot exit code: ${seoExitCode}`
                )
              : 'Weekly KPI snapshot was skipped because Google service-account secrets are not configured in GitHub Actions.';
            const reconcileBody = seoStepRan
              ? readIfExists(
                  reconcilePath,
                  `Reconciliation snapshot missing: ${reconcilePath}\n\nSEO snapshot exit code: ${seoExitCode}`
                )
              : 'GA4 vs Search Console reconciliation was skipped because Google service-account secrets are not configured in GitHub Actions.';

            const seoStatus = !seoStepRan ? 'SKIPPED' : seoExitCode === 0 ? 'PASS' : 'FAIL';
            const workflowRunUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = [
              `Last run: ${new Date().toISOString()}`,
              `Verify status: ${exitCode === 0 ? 'PASS' : 'FAIL'}`,
              `SEO snapshot status: ${seoStatus}`,
              `Workflow run: ${workflowRunUrl}`,
              '',
              '## Verify Report',
              '',
              verifyBody,
              '',
              '## Weekly SEO Snapshot',
              '',
              weeklySeoBody,
              '',
              '## Weekly KPI Snapshot',
              '',
              kpiBody,
              '',
              '## 90-Day Reconciliation',
              '',
              reconcileBody,
              '',
              '## Setup Notes',
              '',
              '- Schedule: every Monday at 14:00 UTC / 8:00 AM CST / 9:00 AM CDT',
              '- Required GitHub secrets: `GOOGLE_SERVICE_ACCOUNT_EMAIL`, `GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY`',
              '- Optional GitHub repository variables: `SEARCH_CONSOLE_PROPERTY`, `GA4_PROPERTY_ID`',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);

            const labels = ['automation', 'health'];
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                labels,
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `Weekly run complete for ${new Date().toISOString().slice(0, 10)}.`,
                  `- Verify: ${exitCode === 0 ? 'PASS' : 'FAIL'}`,
                  `- SEO snapshots: ${seoStatus}`,
                  `- Run: ${workflowRunUrl}`,
                ].join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            }

      - name: Fail Job If Verify Failed
        if: ${{ steps.verify.outputs.exit_code != '0' }}
        shell: pwsh
        run: |
          Write-Error "Verify failed with exit code ${{ steps.verify.outputs.exit_code }}"

      - name: Fail Job If SEO Snapshots Failed
        if: ${{ steps.seo_snapshots.conclusion == 'failure' || steps.seo_snapshots.outputs.exit_code == '1' }}
        shell: pwsh
        run: |
          Write-Error "Weekly SEO snapshots failed"
