name: Deploy Production (Vercel)

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (mobile navigation)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-key"
        run: npm test

      - name: Audit image URLs (Supabase public assets)
        shell: pwsh
        run: pwsh -File scripts/audit-images.ps1

      # This deploy path does NOT rely on Vercel Git integration.
      # Add repo secret: VERCEL_TOKEN
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_WhqqnF14OMjd8EfHj7lVzx7A
          VERCEL_PROJECT_ID: prj_a7IPNCaE1nzmcO8ojPqyDLP0wIti
        run: |
          npx -y vercel@50.15.1 deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Wait for production alias propagation
        run: sleep 20

      - name: Post-deploy conversion performance guardrail (isolated p50)
        run: |
          node scripts/perf/launch-performance-gate.mjs \
            --base-url https://www.susiesjewelryrepair.com \
            --runs 5 \
            --percentile 50 \
            --lcp-threshold-ms 2600 \
            --seo-threshold 100 \
            --isolate \
            --diagnostics \
            --path /contact \
            --path /quote \
            --path /book

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-${{ github.run_id }}
          path: |
            .health/perf-gate-*
            .health/lcp-diagnostics-*.json
          if-no-files-found: warn
